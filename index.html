<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>YAKAP System</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f6;--card:#fff;--tx:#14231f;--mut:#5d6f69;--pr:#0f766e;--prt:#fff;--bd:#d8e2df;--bar:#14b8a6;--dg:#b42318;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1816;--card:#16231f;--tx:#e6f1ee;--mut:#9ab0aa;--pr:#2dd4bf;--prt:#052e2a;--bd:#2a3d38;--bar:#2dd4bf;--dg:#f97066;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:4px 16px 16px}
.top h1{font-size:clamp(24px,4.5vw,34px);line-height:1.1}.top small{font-size:clamp(14px,2.2vw,17px)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
input,select,button{font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);max-width:100%}
button{background:var(--pr);color:var(--prt);border:0;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:transparent;color:var(--dg);padding:4px 8px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>div{flex:1;min-width:130px}.row input,.row select{width:100%}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}.k small{color:var(--mut)}.k b{display:block;font-size:clamp(18px,2.4vw,24px);margin-top:2px;word-break:break-word}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:8px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mut)}
tfoot td{font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;background:transparent;color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pr);color:var(--prt)}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--bd);padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.col i{width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:1px}
.lb{display:flex;gap:6px}.lb span{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.err{color:var(--dg);font-size:13px;min-height:18px}.hide{display:none}

  <div class="card pg-d"><div class="top" style="margin:0 0 8px"><h2 style="margin:0">Output — ${per()}${year}</h2><div style="display:flex;gap:8px"><button class="g" onclick="csv()">Export CSV</button>${adm?`<button class="g" style="color:var(--dg)" onclick="delAll()">Delete all data</button>`:""}</div></div>
 <div class="sc"><table><thead><tr><th>Month</th><th>Registered</th><th>Transmitted</th><th>Returned</th><th>Net amount</th>${adm?"<th></th>":""}</tr></thead><tbody>
 ${R.length?R.sort((a,b)=>a.m-b.m).map(r=>`<tr><td>${lbl(r)}</td><td>${num(r.reg)}</td><td>${num(r.tx)}</td><td>${num(r.ret)}</td><td>${peso(r.net)}</td>${adm?`<td><button class="d" onclick="delRec(${r.id})">Delete</button></td>`:""}</tr>`).join(""):`<tr><td colspan="6" style="text-align:center;color:var(--mut)">No entries for ${year}.</td></tr>`}
 </tbody><tfoot><tr><td>Total</td><td>${num(T.reg)}</td><td>${num(T.tx)}</td><td>${num(T.ret)}</td><td>${peso(T.net)}</td>${adm?"<td></td>":""}</tr></tfoot></table></div></div>
 ${isA?`<div class="card pg-p"><h2>Administrator Profile — OTP &amp; Accounts</h2><div class="row">
 <div><label>Full name</label><input id="an"></div><div><label>Username</label><input id="au"></div><div><label>Gmail (for OTP)</label><input id="ag" type="email" placeholder="name@gmail.com"></div><div><label>Password</label><input id="ap" type="text"></div><div><label>Account type</label><select id="ar"><option value="user">Personnel (view only)</option><option value="admin">Administrator</option></select></div><button onclick="addUser()">Create</button></div>
 <div class="row" style="margin-top:10px"><div><label>Reset code for personnel</label><select id="gp">${users.filter(x=>x.role!="admin").map(x=>`<option value="${esc(x.u)}">${esc(x.name)} (${esc(x.u)})</option>`).join("")||'<option value="">No personnel accounts yet</option>'}</select></div><button onclick="genCode()">Generate reset code</button></div><div id="gm" style="color:#4ade80;font-weight:600;min-height:20px;margin-top:6px">${am}</div><div class="err" id="ue"></div>
 <div style="margin:14px 0 4px;font-weight:700">Password reset requests (OTP received)</div>
 ${reqs.length?reqs.map(o=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--bd)"><span>${esc(o.email)}${gmOf(o.email)?`<br><small style="color:var(--pr)">${esc(gmOf(o.email))}</small>`:""}<br><small style="color:var(--mut)">valid until ${new Date(o.exp).toLocaleTimeString()}</small></span><b style="font-size:22px;letter-spacing:4px;color:var(--pr)">${esc(o.code)}</b><span>${gmOf(o.email)?`<a href="${mailFor(gmOf(o.email),o.code)}" target="_blank" rel="noopener" style="color:var(--pr);margin-right:8px">Send to Gmail</a>`:""}<button class="d" onclick="delOtp('${esc(o.id)}')">Dismiss</button></span></div>`).join(""):'<small style="color:var(--mut)">No requests yet.</small>'}
 <div style="margin:14px 0 4px;font-weight:700">Accounts</div>
 ${users.map(u=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)"><span>${esc(u.name)} <small style="color:var(--mut)">(${esc(u.u)}${u.role=="admin"?", admin":""})</small>${u.email?`<br><small style="color:var(--mut)">${esc(u.email)}</small>`:""}</span>${u.u!="admin"?`<button class="d" onclick="delUser('${esc(u.u)}')">Remove</button>`:`<button class="d" style="color:var(--pr)" onclick="chPw()">Change password</button>`}</div>`).join("")}</div>`:""}`;
}
function mergeDup(a){const m={};a.forEach(r=>{const k=r.y+"-"+r.m;if(m[k]){const x=m[k];x.to=Math.max(x.to||x.m,r.to||r.m);x.reg+=r.reg;x.tx+=r.tx;x.net+=r.net;x.ret=(x.ret||0)+(r.ret||0);x.den=(x.den||0)+(r.den||0);x.ers=(x.ers||0)+(r.ers||0)}else m[k]={...r}});return Object.values(m)}
function lbl(r){return MO[r.m]+((r.to||r.m)>r.m?" – "+MO[r.to]:"")+" "+r.y}
function per(){return mf==0&&mt==11?"":(mf==mt?MO[mf]:MO[mf]+" – "+MO[mt])+" "}
function addRec(){
 const y=+$("#ey").value,m=+$("#em").value,to=$("#emt").value===""?+$("#em").value:+$("#emt").value,reg=+$("#er").value,tx=+$("#et").value,net=+$("#en").value,ret=+$("#eret").value,den=0,ers=0;
 if(to<m){msg="To month must be the same as or after From month.";dash();return}
 if(!y||reg<0||tx<0||net<0||ret<0||den<0||ers<0||(!reg&&!tx&&!net&&!ret&&!den&&!ers)){msg="Enter valid numbers.";dash();return}
 const ex=recs.find(r=>r.y==y&&r.m<=to&&(r.to||r.m)>=m);
 if(ex){$("#ae").style.color="";$("#ae").textContent="Error: "+lbl(ex)+" already has an entry. The same month cannot be added twice. Delete the existing entry first.";return}
 recs.push({id:Date.now(),y,m,to,reg,tx,net,ret,den,ers});
 persist();year=y;msg="✓ Entry added successfully.";dash();
}
function delRec(id){ask("Delete this entry?",()=>{recs=recs.filter(r=>r.id!=id);persist();toast="✓ Entry deleted successfully.";dash()})}
function addUser(){
 const n=$("#an").value.trim(),u=$("#au").value.trim(),p=$("#ap").value,gm=$("#ag").value.trim().toLowerCase();
 if(!n||!u||p.length<4){$("#ue").textContent="Fill all fields (password 4+ characters).";return}
 if($("#ar").value=="user"&&!gm){$("#ue").textContent="Enter the personnel Gmail. It is used to send the OTP if they forget their password.";return}
 if(gm&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(gm)){$("#ue").textContent="Enter a valid Gmail, e.g. name@gmail.com";return}
 if(users.some(x=>x.u.toLowerCase()===u.toLowerCase())){$("#ue").textContent="Username already exists.";return}
 const role=$("#ar").value;if(role=="admin"&&users.filter(x=>x.role=="admin").length>=4){$("#ue").textContent="Limit reached: only 4 administrator accounts are allowed.";return}
 users.push({u,p,name:n,role,email:gm});save("yk_users",users);toast="✓ Account added successfully.";acctMsg="✓ Account added successfully. "+n+" can now log in with the username "+u+".";dash();
}
function delUser(u){ask("Remove account "+u+"?",()=>{users=users.filter(x=>x.u!==u);save("yk_users",users);toast="✓ Account removed successfully.";dash()})}
function chPw(){ask("New administrator password (4+ characters):",v=>{if(v&&v.length>=4){users.find(x=>x.u=="admin").p=v;save("yk_users",users);toast="✓ Password changed successfully."}else{toast="Password must be 4+ characters."}dash()},true)}
function delAll(){
 const R=yrRecs();if(!R.length){toast="No data to delete.";dash();return}
 const ids=R.map(r=>r.id),lbl=per()+year;
 ask("Delete all "+ids.length+" entries shown in the output ("+lbl+")? This cannot be undone.",()=>{recs=recs.filter(r=>!ids.includes(r.id));eds=eds.filter(e=>!(e.y==year&&e.m>=mf&&e.m<=mt));persist();toast="✓ All data deleted successfully ("+ids.length+" entries).";dash()})
}
function ask(msg,yes,input,btn){
 const o=document.createElement("div");o.className="mo";
 o.innerHTML='<div class="mb"><p style="margin:0 0 12px;font-weight:600">'+msg+'</p>'+(input?'<input id="mi" type="password" style="width:100%;margin-bottom:12px">':'')+'<div style="display:flex;gap:8px;justify-content:flex-end"><button class="g" id="mn">Cancel</button><button id="my">'+(btn||(input?"Save":"Yes, delete"))+'</button></div></div>';
 document.body.appendChild(o);
 $("#mn").onclick=()=>o.remove();
 $("#my").onclick=()=>{const v=input?$("#mi").value:null;o.remove();yes(v)};
}
function csv(){
 const rows=[["Year","Month","Registered","Transmitted","Returned","Net Amount"],...yrRecs().sort((a,b)=>a.m-b.m).map(r=>[r.y,MO[r.m]+((r.to||r.m)>r.m?" to "+MO[r.to]:""),r.reg,r.tx,r.ret||0,r.net])];
 const b=new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="yakap-"+year+".csv";a.click();
}
var DB=null,canW=false,UID=null,canD=null,otps=[];
function persist(){save("yk_recs",recs);save("yk_eds",eds);if(DB&&canW)DB.doc("yakap/state").set({recs,eds}).catch(()=>{toast="Could not save to the shared database."})}
function viewOnly(){me={u:"viewer",name:"Viewer",role:"viewer"};render()}
(async()=>{try{
 const u=await claude.use("user");
 canW=u?((await u.canEdit())===true||(await u.isOwner())===true):false;
 UID=u?await u.id():null;canD=u?await u.can("data.write"):null;
 DB=await claude.use("db");
 if(!DB)return;
 const ref=DB.doc("yakap/state");
 if(canW){DB.collection("otp").onSnapshot(q=>{const n=q.docs.map(d=>({id:d.id,...d.data()}));if(JSON.stringify(n)!==JSON.stringify(otps)){otps=n;if(me&&me.role=="admin")dash()}},()=>{})}
 ref.onSnapshot(snap=>{
  if(!snap.exists){if(canW&&recs.length)ref.set({recs,eds}).catch(()=>{});return}
  const r=mergeDup(snap.data().recs||[]),e=(snap.data().eds||[]).map(x=>({...x}));migrate(r,e);
  if(JSON.stringify([r,e])!==JSON.stringify([recs,eds])){recs=r;eds=e;save("yk_recs",recs);save("yk_eds",eds);if(me)dash()}
 },()=>{});
 if(me)dash();else if(!showReg&&!showFg&&!showAdm&&!showAR&&(!$("#lu")||!$("#lu").value))login();
}catch(e){}})();
render();
</script></body></html>
